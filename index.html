<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda CRM — Ávila Ops</title>
    <meta
      name="description"
      content="Agenda, contatos e histórico de relacionamento da operação, sem planilha paralela."
    />

    <!-- Área interna: fora do índice de busca, como app/cliente/mail.
         O card de link (OG abaixo) continua funcionando com noindex. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Card de link (WhatsApp, LinkedIn, X). URL absoluta: caminho relativo
         não é resolvido de forma confiável pelos robôs de preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crm.avilaops.com/" />
    <meta property="og:site_name" content="Ávila Ops" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Agenda CRM — Ávila Ops" />
    <meta
      property="og:description"
      content="Agenda, contatos e histórico de relacionamento da operação, sem planilha paralela."
    />
    <meta property="og:image" content="https://crm.avilaops.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agenda CRM — Ávila Ops" />
    <meta
      name="twitter:description"
      content="Agenda, contatos e histórico de relacionamento da operação, sem planilha paralela."
    />
    <meta name="twitter:image" content="https://crm.avilaops.com/og-default.png" />
