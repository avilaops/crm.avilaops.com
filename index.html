<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Agenda CRM" />
    <!-- A barra do navegador acompanha o fundo da tela de entrada, para o
         atalho na tela inicial do iPhone abrir sem uma faixa branca em cima. -->
    <meta name="theme-color" content="#0b0d10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agenda CRM — Ávila Ops</title>
    <meta
      name="description"
      content="Agenda, contatos e histórico de relacionamento da operação, sem planilha paralela."
    />

    <!-- Área interna: fora do índice de busca, como app/cliente/mail.
         O card de link (OG abaixo) continua funcionando com noindex. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Card de link (WhatsApp, LinkedIn, X). URL absoluta: caminho relativo
         não é resolvido de forma confiável pelos robôs de preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crm.avilaops.com/" />
    <meta property="og:site_name" content="Ávila Ops" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Agenda CRM — Ávila Ops" />
    <meta
      property="og:description"
      content="Agenda, contatos e histórico de relacionamento da operação, sem planilha paralela."
    />
    <meta property="og:image" content="https://crm.avilaops.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agenda CRM — Ávila Ops" />
    <meta
      name="twitter:description"
      content="Agenda, contatos e histórico de relacionamento da operação, sem planilha paralela."
    />
    <meta name="twitter:image" content="https://crm.avilaops.com/og-default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
