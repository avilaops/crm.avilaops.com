[package]
name = "agenda-contatos"
version = "0.1.0"
description = "Agenda desktop de contatos com email e WhatsApp OAuth2"
authors = ["Nícolas Ávila <contato@avilaops.com>"]
license = "Private"
repository = "https://github.com/avilaops/agenda-contatos-desktop"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2.7.2"
