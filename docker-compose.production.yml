services:
  app:
    # Imagem pronta do ghcr.io, publicada pelo .github/workflows/imagem.yml.
    # O servidor tem 2 vCPU e ~1 GB livre: buildar aqui competia por RAM com o
    # Postgres e derrubava o CRM quando estourava. Agora o deploy é um `pull`.
    #
    # Para buildar localmente (desenvolvimento), use:
    #   docker compose -f docker-compose.production.yml build app
    # depois de descomentar o `build` abaixo.
    image: ghcr.io/avilaops/crm.avilaops.com:latest
    # build:
    #   context: .
    container_name: agenda-crm-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production.local
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      # Imagem de campanha da newsletter vive fora da imagem: o e-mail é aberto
      # semanas depois e o link não pode morrer no próximo deploy.
      - agenda-crm-storage:/app/storage
    networks:
      - agenda-crm

  db:
    # Subiu do 16 para o 18 em 01/09/2026, para o servidor bater com o ambiente
    # de desenvolvimento. Um data directory do 16 não é legível pelo 18, então a
    # troca foi por dump e restore, não por troca de imagem.
    image: postgres:18-alpine
    container_name: agenda-crm-db
    restart: unless-stopped
    env_file:
      - .env.production.local
    environment:
      POSTGRES_DB: agenda_crm
      POSTGRES_USER: agenda_crm
      # A imagem do Postgres 18 mudou o PGDATA padrão de /var/lib/postgresql/data
      # para /var/lib/postgresql/18/docker. Sem fixar isto, o volume abaixo seria
      # montado num caminho que o servidor ignora e o 18 iniciaria um cluster
      # vazio dentro do container: o CRM apareceria com o banco zerado e os dados
      # ficariam órfãos no volume. Não é hipótese — foi verificado na imagem.
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Volume novo. O agenda-crm-postgres, com o cluster do 16, segue intacto:
      # o rollback é voltar a imagem para postgres:16-alpine, apontar para ele e
      # remover o PGDATA acima.
      - agenda-crm-postgres-18:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda_crm -d agenda_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agenda-crm

networks:
  agenda-crm:
    name: agenda-crm

volumes:
  agenda-crm-postgres-18:
    name: agenda-crm-postgres-18
  agenda-crm-storage:
    name: agenda-crm-storage
