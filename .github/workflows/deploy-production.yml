name: Build e deploy

# O mesmo pipeline do app.avilaops.com, com os dados do CRM: valida, constrói a
# imagem pelo workflow compartilhado do avilaops/infra e, na main, implanta pelo
# despachante do servidor. Passo a passo da ativação em docs/OPERACAO.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Validar lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # A mesma versão do agenda-crm-db em produção.
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Typecheck, lint, testes (CLI, backend e web) e build.
      - run: npm run validate
      - name: Isolamento entre empresas contra o PostgreSQL
        # O teste recusa banco sem `/crm_test_` no endereço, para nunca rodar em
        # produção por engano. Vinha do ci.yml, que este workflow substitui.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_test_ci
          CRM_INTEGRATION_TEST: '1'
          CRM_TEST_MODE: '1'
          NODE_ENV: test
        run: node --test backend/test/tenant-integration.test.mjs
      - name: Aplicar o schema duas vezes no banco descartável
        # A imagem aplica o schema a cada início de container, porque o
        # despachante do servidor não tem etapa de migração. Então ele precisa
        # ser idempotente: a segunda passada pega um `create table` sem
        # `if not exists` aqui, e não num deploy que volta sozinho para trás.
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_test_ci
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Conferir o pacote do CLI
        run: npm run cli:pack
      - run: npm ci --prefix worker
      - run: npm run worker:typecheck
  image:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: avilaops/infra/.github/workflows/container.yml@5de9dd168d6db14764d9ca9a9338f72929652eb5
    with:
      publish: ${{ github.event_name != 'pull_request' }}
      # Variáveis do repositório, não secrets: o Vite grava estes valores no
      # JavaScript que o navegador baixa.
      build-args: |
        VITE_SUPORTE_WHATSAPP=${{ vars.VITE_SUPORTE_WHATSAPP }}
        VITE_SUPORTE_EMAIL=${{ vars.VITE_SUPORTE_EMAIL }}
  deploy:
    permissions:
      contents: read
      packages: read
    needs: image
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    uses: avilaops/infra/.github/workflows/deploy-ssh.yml@5de9dd168d6db14764d9ca9a9338f72929652eb5
    with:
      application: crm.avilaops.com
      image: ${{ needs.image.outputs.image }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
