name: Imagem do Agenda CRM

# Por que existe: o Hetzner tem 2 vCPU e ~1 GB livre. Buildar Vite + TS lá
# competia por RAM com o Postgres e com o worker de IA, e um build que estoura
# derruba o CRM. Aqui o build sai no runner do GitHub e o servidor só faz
# `docker compose pull` — segundos, sem risco.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Validar aplicacao
        run: npm run validate

  imagem:
    name: Build e publicacao no ghcr.io
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/avilaops/crm.avilaops.com:latest
            ghcr.io/avilaops/crm.avilaops.com:${{ github.sha }}
          # Cache no proprio registry: o segundo build reaproveita o npm ci.
          cache-from: type=registry,ref=ghcr.io/avilaops/crm.avilaops.com:cache
          cache-to: type=registry,ref=ghcr.io/avilaops/crm.avilaops.com:cache,mode=max

      - name: Como subir no servidor
        run: echo "cd /opt/agenda-crm/current && docker compose -f docker-compose.production.yml --env-file .env.production.local pull app && docker compose -f docker-compose.production.yml --env-file .env.production.local up -d app"
